[package]
name = "mavplayer"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "A fast, native media player for video, music, streams and DVDs"
license = "GPL-3.0-or-later"
authors = ["Drogobo"]
repository = "https://github.com/Drogobo/mavplayer"
readme = "README.md"
keywords = ["media-player", "video", "audio", "dvd", "ffmpeg"]
categories = ["multimedia::video", "multimedia::audio"]
# Keep build output and packaging work folders out of the package (and out of
# Cargo's file scan; makepkg's pkg/ folder is unreadable while it builds).
exclude = ["/packaging/arch/src", "/packaging/arch/pkg", "/ffmpeg-build", "/spa-headers", "/dist", "/.flatpak-builder"]

[features]
default = []
# Link FFmpeg statically (release builds; see scripts/build-ffmpeg.sh).
static-ffmpeg = ["ffmpeg-sys-next/static"]

[dependencies]
cosmic-text = "=0.14.2"
fontdb = { version = "0.16", default-features = false, features = ["std", "fs"] }
ttf-parser = "0.20" # Read variable font wght axes (already a transitive dependency)
gpui = "0.2.2"
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat", "avfilter", "swscale", "swresample"] }
cpal = "0.18"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18" # Encode one-bit playlist waveform masks
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
dirs = "6"
unicode-segmentation = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Media keys and now-playing info: MPRIS (Linux), SMTC (Windows), Now Playing (macOS).
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
sys-locale = "0.3"

# Native PipeWire audio output (cpal's ALSA host is the fallback).
[target.'cfg(target_os = "linux")'.dependencies]
# v0_3_44: target.object (PipeWire 0.3.44+; CI builds on Ubuntu 22.04, which has 0.3.48).
pipewire = { version = "0.10", features = ["v0_3_44"] }
# Startup font prefetch (font_prefetch.rs). These are the same fontdb and
# fontconfig-parser versions cosmic-text (GPUI's Linux text system) uses, so
# the prefetch parses fonts exactly as GPUI's own scan does.
fontconfig-parser = "0.5"
memmap2 = "0.9"
# System tray icon (StatusNotifierItem over D-Bus; KDE, and GNOME with the
# AppIndicator extension). Same zbus and async-io as souvlaki's MPRIS.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# setsid(), dup2() and _exit() for the hand-over to the process that waits in
# the system tray.
libc = "0.2"

# The window handle the Windows media controls attach to.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# System tray icon on Windows (notification area) and macOS (menu bar).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[patch.crates-io]
# xattr 0.2.3 (pulled in by gpui's http client) references libc::ENOATTR,
# which recent libc releases removed on Linux. See third_party/xattr.
xattr = { path = "third_party/xattr" }
# ksni 0.3.7 plus a `dbus_name` option: the tray icon keeps one D-Bus name
# that the process taking over in the tray inherits, so the icon never blinks
# out. See src/ui/tray.rs.
ksni = { path = "third_party/ksni" }
# blade-graphics 0.7.1 (GPUI's renderer) with ray tracing never enabled: on
# NVIDIA it costs 50 MB in every process. See third_party/blade-graphics.
blade-graphics = { path = "third_party/blade-graphics" }
# gpui 0.2.2 plus `Window::set_window_visible`: "Play in the background"
# hides the player window to the tray and shows it again, while it plays on.
# See third_party/gpui/MAVPLAYER-PATCH.md.
gpui = { path = "third_party/gpui" }
# blade-util 0.3.0, whose staging belt (GPUI uploads every video frame
# through it) frees big chunks it no longer uses. See third_party/blade-util.
blade-util = { path = "third_party/blade-util" }
# souvlaki 0.9.3 (media keys, MPRIS) without its 100 Hz polling loop, which
# woke the CPU all the time, even when idle. See third_party/souvlaki.
souvlaki = { path = "third_party/souvlaki" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# No cross-crate LTO. `src/mem.rs` is the global allocator, and with
# cross-crate thin LTO, LLVM copies its `__rust_alloc_zeroed` into other
# crates' modules; when it then turns a `__rust_alloc` + memset there into a
# call to that copy, LLVM 23's inliner crashes (SIGSEGV in
# `LazyCallGraph::removeDeadFunctions`). Whether it does depends on chance:
# `-C target-cpu=native` (CachyOS's makepkg default) and even the build path
# set it off. Fat LTO avoids it too, but takes seven minutes to link.
lto = false
codegen-units = 4
strip = "symbols"
panic = "unwind"

# One codegen unit, so the allocator shim never has a copy in another one
# either (and MavPlayer's own code is still optimized as a whole).
[profile.release.package.mavplayer]
codegen-units = 1

# ── Linux packages ──────────────────────────────────────────────────────────
# `cargo deb` (cargo install cargo-deb) and `cargo generate-rpm`
# (cargo install cargo-generate-rpm); see HACKING.md / scripts/package-linux.sh.

[package.metadata.deb]
name = "mavplayer"
maintainer = "Drogobo <https://github.com/Drogobo>"
copyright = "MavPlayer contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
MavPlayer plays almost any video or audio file, network streams and DVDs. \
It has a native GPU-accelerated interface, hardware video decoding, \
subtitles, an equalizer, video adjustments and resume support."""
section = "video"
priority = "optional"
# FFmpeg is linked statically; the rest is detected from the binary.
depends = "$auto"
recommends = "libdvdcss2"
assets = [
    ["target/release/mavplayer", "usr/bin/", "755"],
    ["packaging/linux/io.github.drogobo.MavPlayer.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.drogobo.MavPlayer.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/io.github.drogobo.MavPlayer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/mavplayer-16.png", "usr/share/icons/hicolor/16x16/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-48.png", "usr/share/icons/hicolor/48x48/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["packaging/icons/mavplayer-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.drogobo.MavPlayer.png", "644"],
    ["README.md", "usr/share/doc/mavplayer/", "644"],
    ["third_party/shaders/LICENSES.txt", "usr/share/doc/mavplayer/SHADER-LICENSES.txt", "644"],
]

[package.metadata.generate-rpm]
name = "mavplayer"
license = "GPL-3.0-or-later"
summary = "Fast, native media player for video, music, streams and DVDs"
url = "https://github.com/Drogobo/mavplayer"
assets = [
    { source = "target/release/mavplayer", dest = "/usr/bin/mavplayer", mode = "755" },
    { source = "packaging/linux/io.github.drogobo.MavPlayer.desktop", dest = "/usr/share/applications/io.github.drogobo.MavPlayer.desktop", mode = "644" },
    { source = "packaging/linux/io.github.drogobo.MavPlayer.metainfo.xml", dest = "/usr/share/metainfo/io.github.drogobo.MavPlayer.metainfo.xml", mode = "644" },
    { source = "packaging/linux/io.github.drogobo.MavPlayer.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.drogobo.MavPlayer.svg", mode = "644" },
    { source = "packaging/icons/mavplayer-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.drogobo.MavPlayer.png", mode = "644" },
    { source = "packaging/icons/mavplayer-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.drogobo.MavPlayer.png", mode = "644" },
    { source = "packaging/icons/mavplayer-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.drogobo.MavPlayer.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/mavplayer/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/mavplayer/README.md", mode = "644", doc = true },
    { source = "third_party/shaders/LICENSES.txt", dest = "/usr/share/licenses/mavplayer/SHADER-LICENSES.txt", mode = "644", doc = true },
]
auto-req = "auto"

[package.metadata.generate-rpm.recommends]
libdvdcss = "*"
